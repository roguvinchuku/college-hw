<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Table Webpage</title>
</head>

<body style="margin: 0; padding: 0;">

	<style>
		table, th, td {
			border: 2px solid black;
			border-collapse: collapse;
		}
	</style>

	<table style="width: 100%; height: 100vh;">
		<tr>
			<td colspan="2" style="height: 80px; text-align: center;">Table Header</td>
		</tr>
		<tr>
			<td style="padding: 8px">
				<table style="width: 100%; height: 100%;">
					<tr>
						<td style="width: 200px;">Sidebar</td>
						<td>Main element</td>
					</tr>
				</table>
			</td>
		</tr>
		<tr>
			<td colspan="2" style="height: 32px; text-align: center;">Footer</td>
		</tr>
	</table>
</body>
</html>
